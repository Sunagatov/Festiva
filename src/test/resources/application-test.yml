spring:
  autoconfigure:
    exclude: org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
  main:
    allow-bean-definition-overriding: true

telegram:
  bot:
    token: test-token
    username: test-bot

kafka:
  enabled: false

festiva:
  reminder:
    startup-check:
      enabled: false
    schedule:
      enabled: false

logging:
  level:
    root: WARN
    com.festiva: INFO
    org.mongodb.driver: WARN
    org.springframework.boot.test: WARN
    org.springframework.test: WARN
    org.springframework.data.mongodb: WARN
    org.testcontainers: WARN
