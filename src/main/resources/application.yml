spring:
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: false
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}
    database: ${MONGO_DATABASE_NAME:FestivaDatabase}

management:
  metrics:
    tags:
      application: ${spring.application.name:festiva-bot}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORTER_ENABLED:false}
  tracing:
    export:
      enabled: ${OTEL_EXPORTER_ENABLED:false}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

logging:
  level:
    org.telegram.telegrambots: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p --- [%15.15t] %-40.40logger{39} traceId=%X{traceId:-} spanId=%X{spanId:-} : %m %kvp%n%wEx"
  group:
    festiva: com.festiva
    telegram: org.telegram.telegrambots

kafka:
  enabled: ${APP_KAFKA_ENABLED:false}
  topic: festiva.bot.metric
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  api-key: ${KAFKA_API_KEY:}
  api-secret: ${KAFKA_API_SECRET:}

ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model-name: ${AI_MODEL_NAME:gpt-4o-mini}
  daily-call-limit: ${AI_DAILY_CALL_LIMIT:100}

festiva:
  abuse:
    updates-per-user-minute: ${FESTIVA_ABUSE_UPDATES_PER_USER_MINUTE:30}
    updates-per-minute: ${FESTIVA_ABUSE_UPDATES_PER_MINUTE:300}
    imports-per-user-hour: ${FESTIVA_ABUSE_IMPORTS_PER_USER_HOUR:3}
    imports-per-hour: ${FESTIVA_ABUSE_IMPORTS_PER_HOUR:20}
