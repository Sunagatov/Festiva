welcome=\ud83c\udf82 <b>Добро пожаловать в Festiva!</b>\n\nБольше никаких забытых дней рождения. Festiva напомнит вам <b>сегодня</b>, <b>завтра</b> и <b>за 7 дней</b> до каждого дня рождения.\n\n\u2728 Добавляйте друзей, просматривайте по месяцам, получайте уведомления о юбилеях, импортируйте и экспортируйте через CSV.\n\nНажмите \u2139\ufe0f <b>О боте</b>, чтобы узнать больше, или сразу \u2795 <b>Добавить</b>.
menu=\ud83d\udcd6 <b>Как пользоваться Festiva</b>\n\nБольшинство повседневных действий доступны на клавиатуре ниже.\n\n\u2795 Добавить \u2014 сохранить новый день рождения\n\ud83c\udf82 Сегодня \u2014 посмотреть дни рождения на сегодня\n\ud83d\udd14 Ближайшие \u2014 увидеть ближайшие дни рождения\n\ud83d\udc65 Друзья \u2014 открыть полный список\n\u2699\ufe0f Ещё \u2014 поиск, редактирование, удаление, просмотр, статистика, импорт, экспорт, язык, напоминания и информация\n\n\u2328\ufe0f <b>Команды вручную</b>\nЕсли удобно, используйте slash-команды, например: <code>/add</code>, <code>/more</code>, <code>/settings</code>, <code>/cancel</code>.
