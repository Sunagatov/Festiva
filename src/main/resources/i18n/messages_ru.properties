ics_prompt=\ud83d\udcc5 <b>Как экспортировать из Google Календаря:</b>\n1. Откройте calendar.google.com\n2. Нажмите \u2699\ufe0f Настройки\n3. В левой панели найдите <b>ваш календарь</b> (например, ваше имя или email)\n4. Прокрутите вниз до <b>Экспорт календаря</b> и нажмите\n5. Разархивируйте скачанный .zip файл\n6. Отправьте <b>.ics файл, названный по вашему email</b> (не Birthdays_*.ics)\n\nИли нажмите /cancel для отмены.
