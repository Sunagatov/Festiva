welcome=\ud83c\udf82 <b>Welcome to Festiva\!</b>\n\nNever forget a friend's birthday again. Festiva reminds you <b>today</b>, <b>tomorrow</b>, and <b>7 days</b> before every birthday.\n\n\u2728 Add friends, browse by month, get milestone alerts, import & export via CSV.\n\nTap \u2139\ufe0f <b>About</b> to learn more, or just start with \u2795 <b>Add</b>.
menu=\ud83d\udcd6 <b>How to use Festiva</b>\n\nMost day-to-day actions are available from the reply keyboard below.\n\n\u2795 Add \u2014 save a new birthday\n\ud83c\udf82 Today \u2014 see today's birthdays\n\ud83d\udd14 Upcoming \u2014 check the next birthdays\n\ud83d\udc65 Friends \u2014 open your full list\n\u2699\ufe0f More \u2014 search, edit, remove, browse, stats, import, export, language, reminders, and about\n\n\u2328\ufe0f <b>Typed commands</b>\nUse slash commands when convenient, for example: <code>/add</code>, <code>/more</code>, <code>/settings</code>, <code>/cancel</code>.
